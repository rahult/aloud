[package]
name = "chirp"
version = "0.2.0"
description = "Local neural text-to-speech as a menu-bar desktop app"
authors = ["Chirp contributors"]
edition = "2021"
[lib]
name = "chirp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# Synthetic Cmd/Ctrl+C for capturing the selection. Cross-platform.
enigo = "0.6"
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }

# Accessibility permission, the Services menu, and Now Playing are macOS-only;
# gating them keeps the Windows and Linux release builds from pulling ObjC.
[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
objc2-media-player = { version = "0.3", features = ["MPNowPlayingInfoCenter", "MPRemoteCommandCenter", "MPRemoteCommand"] }
